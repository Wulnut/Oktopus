  /api/tenants/{slug}/firmware:
    get:
      tags: [Firmware]
      summary: List firmware
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Firmware list sorted by creation date (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Firmware'

    post:
      tags: [Firmware]
      summary: Upload firmware
      description: |
        Upload firmware metadata and file. Either a file (multipart upload) or a download_url
        (URL reference) must be provided.

        Required fields: name, build_version.
        The file is forwarded to the file-server service for storage.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name for the firmware
                build_version:
                  type: string
                  description: Build version string
                vendor:
                  type: string
                model:
                  type: string
                hw_version:
                  type: string
                phase:
                  type: string
                  enum: [internal_testing, release]
                file:
                  type: string
                  format: binary
                  description: Firmware binary file
                download_url:
                  type: string
                  description: Alternative download URL if no file uploaded
                file_name:
                  type: string
                fingerprint:
                  type: string
              required: [name, build_version]
      responses:
        '201':
          description: Firmware created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Firmware'
        '400':
          description: Bad request (missing required fields)
        '409':
          description: Firmware with this identity (vendor+model+hw+build) already exists

  /api/tenants/{slug}/firmware/{id}:
    put:
      tags: [Firmware]
      summary: Update firmware metadata
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Firmware MongoDB ObjectID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFirmwareRequest'
      responses:
        '204':
          description: Updated
        '400':
          description: Bad request
        '404':
          description: Firmware not found

    delete:
      tags: [Firmware]
      summary: Delete firmware
      description: |
        Deletes the firmware file from the file server and removes the database entry.
        Also disables any campaigns referencing this firmware.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid ID
        '404':
          description: Firmware not found

  /api/tenants/{slug}/firmware/{id}/phase:
    put:
      tags: [Firmware]
      summary: Update firmware phase
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFirmwarePhaseRequest'
      responses:
        '204':
          description: Phase updated
        '400':
          description: Bad request or invalid phase

  # =========================================================================
  # Scripts
  # =========================================================================
  /api/tenants/{slug}/scripts:
    get:
      tags: [Scripts]
      summary: List scripts
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Script list sorted by creation date (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Script'

    post:
      tags: [Scripts]
      summary: Create script
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScriptRequest'
      responses:
        '201':
          description: Script created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '400':
          description: Validation error

  /api/tenants/{slug}/scripts/{id}:
    get:
      tags: [Scripts]
      summary: Get script by ID
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Script MongoDB ObjectID
      responses:
        '200':
          description: Script details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
        '400':
          description: Invalid ID
        '404':
          description: Script not found

    put:
      tags: [Scripts]
      summary: Update script
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScriptRequest'
      responses:
        '204':
          description: Updated
        '400':
          description: Validation error or invalid ID
        '404':
          description: Script not found

    delete:
      tags: [Scripts]
      summary: Delete script
      description: Built-in scripts cannot be deleted.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid ID
        '403':
          description: Cannot delete built-in scripts
        '404':
          description: Script not found

  /api/tenants/{slug}/scripts/{id}/execute/{sn}/{mtp}:
    post:
      tags: [Scripts]
      summary: Execute script on a device
      description: |
        Runs a script's steps against a target device via the specified MTP protocol.
        Supports variables, conditions, delays, and error handling (abort/continue/skip_to).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Script MongoDB ObjectID
        - name: sn
          in: path
          required: true
          schema:
            type: string
          description: Device serial number
        - $ref: '#/components/parameters/Mtp'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteScriptRequest'
      responses:
        '200':
          description: Script execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptExecution'
        '400':
          description: Bad request (missing variables, invalid ID)
        '404':
          description: Script not found
        '503':
          description: Device is offline

  /api/tenants/{slug}/scripts/{id}/executions:
    get:
      tags: [Scripts]
      summary: List script execution history
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution history (last 50)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScriptExecution'

  /api/tenants/{slug}/scripts/{id}/executions/{execId}:
    get:
      tags: [Scripts]
      summary: Get single execution details
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: execId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptExecution'
        '400':
          description: Invalid ID
        '404':
          description: Execution not found

  # =========================================================================
  # Campaigns
  # =========================================================================
  /api/tenants/{slug}/campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Campaign list sorted by creation date (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'

    post:
      tags: [Campaigns]
      summary: Create campaign
      description: |
        Creates a firmware upgrade campaign. Campaigns target devices matching vendor+model+hw_version.
        Uses vendor/model/hw_version from the firmware if fields are empty or set to "*".
        If enabled=true, starts running immediately.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Bad request
        '409':
          description: Campaign already exists for this vendor+model+hw_version

  /api/tenants/{slug}/campaigns/{id}:
    put:
      tags: [Campaigns]
      summary: Update campaign
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Campaign MongoDB ObjectID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '204':
          description: Updated
        '400':
          description: Bad request
        '404':
          description: Campaign not found

    delete:
      tags: [Campaigns]
      summary: Delete campaign
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid ID

  /api/tenants/{slug}/campaigns/{id}/logs:
    get:
      tags: [Campaigns]
      summary: Get campaign upgrade logs
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Upgrade logs for the campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignLogsResponse'

  # =========================================================================
  # Mass Actions
  # =========================================================================
  /api/tenants/{slug}/mass-actions:
    get:
      tags: [Mass Actions]
      summary: List mass actions
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Mass actions list (last 100)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MassAction'

  /api/tenants/{slug}/mass-actions/script:
    post:
      tags: [Mass Actions]
      summary: Execute script on multiple devices
      description: Creates a mass action to run a script against selected devices.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MassScriptExecutionRequest'
      responses:
        '201':
          description: Mass action created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassAction'

  /api/tenants/{slug}/mass-actions/{id}:
    get:
      tags: [Mass Actions]
      summary: Get mass action details
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Mass action MongoDB ObjectID
      responses:
        '200':
          description: Mass action details with device results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassAction'
