openapi: "3.0.3"
info:
  title: Oktopus API
  description: |
    Oktopus is an Open Source USP Controller and CWMP multi-vendor management platform for CPEs and IoT devices.

    ## Multi-tenancy
    - SuperAdmin (level 0): Platform owner, full access to all tenants
    - TenantAdmin (level 1): ISP admin, manages users and resources within their tenant
    - Operator (level 2): Day-to-day device management within their tenant

    ## Authentication
    All endpoints under `/api/tenants/{slug}` require a valid JWT Bearer token. Auth endpoints (`/api/auth/*`) do not require authentication.
  version: "1.0.0"
  contact:
    name: Oktopus
    url: https://github.com/OktopUSP/oktopus

servers:
  - url: http://localhost
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from `PUT /api/auth/login`

  schemas:
    # --- Error ---
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    # --- Auth ---
    TokenRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: string
      description: JWT token string

    AdminRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        phone:
          type: string

    AdminExistsResponse:
      type: boolean
      description: Whether a SuperAdmin user already exists

    # --- Tenant ---
    Tenant:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, disabled]
        auth_policy:
          $ref: '#/components/schemas/TenantAuthPolicy'
        ca_certs:
          type: array
          items:
            $ref: '#/components/schemas/TenantCACert'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantAuthPolicy:
      type: object
      properties:
        password_required:
          type: boolean
        cert_required:
          type: boolean

    TenantCACert:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        pem:
          type: string
          description: PEM-encoded certificate
        not_after:
          type: string
          format: date-time
        added_at:
          type: string
          format: date-time

    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        auth_policy:
          $ref: '#/components/schemas/TenantAuthPolicy'
        admin_email:
          type: string
          format: email
        admin_name:
          type: string
        admin_password:
          type: string

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        auth_policy:
          $ref: '#/components/schemas/TenantAuthPolicy'

    # --- Device Password ---
    DevicePassword:
      type: object
      properties:
        password:
          type: string

    SetDevicePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # --- CA Cert ---
    AddCACertRequest:
      type: object
      required: [label, pem]
      properties:
        label:
          type: string
        pem:
          type: string
          description: PEM-encoded certificate

    # --- User ---
    User:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        level:
          type: integer
          description: "0=SuperAdmin, 1=TenantAdmin, 2=Operator"
        createdAt:
          type: string
          format: date-time

    RegisterUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        phone:
          type: string

    ChangePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8

    # --- Device ---
    Device:
      type: object
      properties:
        SN:
          type: string
          description: Serial number
        Model:
          type: string
        TenantID:
          type: string
        Vendor:
          type: string
        Version:
          type: string
        ProductClass:
          type: string
        HWVersion:
          type: string
        Alias:
          type: string
        Status:
          type: integer
          description: "0=Offline, 1=Associating, 2=Online"
        Mqtt:
          type: integer
          description: MQTT connection status
        Stomp:
          type: integer
          description: STOMP connection status
        Websockets:
          type: integer
          description: WebSocket connection status
        Cwmp:
          type: integer
          description: CWMP connection status

    DevicesList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        total:
          type: integer

    FilterOptions:
      type: object
      properties:
        models:
          type: array
          items: { type: string }
        productClasses:
          type: array
          items: { type: string }
        vendors:
          type: array
          items: { type: string }
        versions:
          type: array
          items: { type: string }

    SetAliasRequest:
      type: object
      required: [sn, alias]
      properties:
        sn:
          type: string
          description: Device serial number
        alias:
          type: string

    GenericMessageRequest:
      type: object
      properties:
        data:
          type: object
          description: Raw JSON payload for the USP/CWMP message

    WifiConfigRequest:
      type: object
      description: WiFi configuration parameters

    # --- Device Auth ---
    DeviceAuthEntry:
      type: object
      properties:
        key:
          type: string
          description: Device serial number or key
        value:
          type: string
          description: Device password

    TemplateMessageRequest:
      type: object
      properties:
        name:
          type: string
        message:
          type: object
          description: Template message payload

    TemplateMessage:
      type: object
      properties:
        name:
          type: string
        message:
          type: object

    # --- Firmware ---
    Firmware:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        vendor:
          type: string
        model:
          type: string
        hw_version:
          type: string
        build_version:
          type: string
        file_size:
          type: integer
        fingerprint:
          type: string
          description: SHA-256 hash of firmware file
        phase:
          type: string
          enum: [internal_testing, release]
        download_url:
          type: string
        file_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateFirmwareRequest:
      type: object
      required: [name, build_version]
      properties:
        name:
          type: string
        vendor:
          type: string
        model:
          type: string
        hw_version:
          type: string
        build_version:
          type: string

    UpdateFirmwarePhaseRequest:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [internal_testing, release]

    # --- Script ---
    ScriptVariable:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        default: { type: string }
        required: { type: boolean }

    ScriptCondition:
      type: object
      properties:
        source: { type: string }
        path: { type: string }
        param: { type: string }
        operator:
          type: string
          enum: ["==", "!=", ">", "<", "contains", "exists"]
        value: { type: string }

    ScriptParamSetting:
      type: object
      properties:
        param: { type: string }
        value: { type: string }
        required: { type: boolean }

    ScriptInputArg:
      type: object
      properties:
        key: { type: string }
        value: { type: string }

    ScriptStep:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [GET, SET, ADD, DELETE, OPERATE, CONDITION, DELAY]
        on_error: { type: string }
        param_paths: { type: array, items: { type: string } }
        max_depth: { type: integer }
        save_result_as: { type: string }
        obj_path: { type: string }
        param_settings: { type: array, items: { $ref: '#/components/schemas/ScriptParamSetting' } }
        obj_paths: { type: array, items: { type: string } }
        command: { type: string }
        command_key: { type: string }
        input_args: { type: array, items: { $ref: '#/components/schemas/ScriptInputArg' } }
        condition: { $ref: '#/components/schemas/ScriptCondition' }
        on_true: { type: string }
        on_false: { type: string }
        duration_ms: { type: integer }

    Script:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        variables: { type: array, items: { $ref: '#/components/schemas/ScriptVariable' } }
        steps: { type: array, items: { $ref: '#/components/schemas/ScriptStep' } }
        builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateScriptRequest:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        variables: { type: array, items: { $ref: '#/components/schemas/ScriptVariable' } }
        steps: { type: array, items: { $ref: '#/components/schemas/ScriptStep' } }

    UpdateScriptRequest:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        variables: { type: array, items: { $ref: '#/components/schemas/ScriptVariable' } }
        steps: { type: array, items: { $ref: '#/components/schemas/ScriptStep' } }

    ExecuteScriptRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties:
            type: string

    StepResult:
      type: object
      properties:
        step_id: { type: string }
        step_name: { type: string }
        status: { type: string }
        response: { type: object }
        error: { type: string }
        condition_result: { type: boolean }
        jumped_to: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    ScriptExecution:
      type: object
      properties:
        id: { type: string }
        script_id: { type: string }
        script_name: { type: string }
        device_sn: { type: string }
        mtp: { type: string }
        status:
          type: string
          enum: [running, completed, failed]
        variables:
          type: object
          additionalProperties: { type: string }
        step_results:
          type: array
          items: { $ref: '#/components/schemas/StepResult' }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # --- Campaign ---
    Campaign:
      type: object
      properties:
        id: { type: string }
        vendor: { type: string }
        model: { type: string }
        hw_version: { type: string }
        firmware_id: { type: string }
        concurrency:
          type: integer
          minimum: 1
          maximum: 50
        time_window_start: { type: string }
        time_window_end: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCampaignRequest:
      type: object
      required: [vendor, model, hw_version, firmware_id]
      properties:
        vendor: { type: string }
        model: { type: string }
        hw_version: { type: string }
        firmware_id: { type: string }
        concurrency:
          type: integer
          minimum: 1
          maximum: 50
        time_window_start: { type: string }
        time_window_end: { type: string }
        enabled: { type: boolean }

    UpdateCampaignRequest:
      type: object
      properties:
        firmware_id: { type: string }
        concurrency:
          type: integer
          minimum: 1
          maximum: 50
        time_window_start: { type: string }
        time_window_end: { type: string }
        enabled: { type: boolean }

    # --- Firmware Upgrade Log ---
    FirmwareUpgradeLog:
      type: object
      properties:
        id: { type: string }
        device_sn: { type: string }
        device_alias: { type: string }
        campaign_id: { type: string }
        firmware_id: { type: string }
        firmware_name: { type: string }
        firmware_build_ver: { type: string }
        previous_version: { type: string }
        trigger_type: { type: string }
        status:
          type: string
          enum: [pending, downloading, success, failed]
        error: { type: string }
        retry_count: { type: integer }
        triggered_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    CampaignLogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/FirmwareUpgradeLog'
        total:
          type: integer

    # --- FW Policy ---
    DeviceFWPolicy:
      type: object
      properties:
        device_sn: { type: string }
        policy:
          type: string
          enum: [campaign, skip, manual]
        manual_firmware_id: { type: string }

    SetFWPolicyRequest:
      type: object
      required: [policy]
      properties:
        policy:
          type: string
          enum: [campaign, skip, manual]
        manual_firmware_id: { type: string }

    # --- Mass Action ---
    DeviceResult:
      type: object
      properties:
        device_sn: { type: string }
        status:
          type: string
          enum: [pending, running, success, failed, skipped]
        mtp: { type: string }
        error: { type: string }
        execution_id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    MassAction:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [firmware_update, script]
        name: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        device_sns:
          type: array
          items: { type: string }
        total_devices: { type: integer }
        firmware_id: { type: string }
        firmware_name: { type: string }
        firmware_url: { type: string }
        script_id: { type: string }
        script_name: { type: string }
        variables:
          type: object
          additionalProperties: { type: string }
        device_results:
          type: array
          items: { $ref: '#/components/schemas/DeviceResult' }
        progress: { type: integer }
        success_count: { type: integer }
        failure_count: { type: integer }
        concurrency: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    MassScriptExecutionRequest:
      type: object
      required: [script_id, device_sns]
      properties:
        script_id: { type: string }
        device_sns:
          type: array
          items: { type: string }
        variables:
          type: object
          additionalProperties: { type: string }
        concurrency:
          type: integer

    # --- Dashboard Info ---
    VendorsCount:
      type: object
      properties:
        vendor: { type: string }
        count: { type: integer }

    ProductClassCount:
      type: object
      properties:
        productClass: { type: string }
        count: { type: integer }

    StatusCount:
      type: object
      properties:
        status: { type: integer }
        count: { type: integer }

    GeneralInfo:
      type: object
      properties:
        device_count: { type: integer }
        online_count: { type: integer }
        offline_count: { type: integer }

  parameters:
    TenantSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Tenant URL slug

    DeviceSN:
      name: sn
      in: path
      required: true
      schema:
        type: string
      description: Device serial number

    Mtp:
      name: mtp
      in: path
      required: true
      schema:
        type: string
      description: "Message Transfer Protocol: mqtt, ws (WebSocket), stomp, or cwmp"

tags:
  - name: Auth
    description: Authentication endpoints (no JWT required)
  - name: Tenants
    description: Tenant management (SuperAdmin only)
  - name: Devices
    description: Device management and USP/CWMP operations
  - name: Firmware
    description: Firmware lifecycle management
  - name: Scripts
    description: Script editor and execution engine
  - name: Campaigns
    description: Firmware upgrade campaigns
  - name: Mass Actions
    description: Bulk operations on devices
  - name: Users
    description: User management within a tenant
  - name: CA Certs
    description: Tenant CA certificate management
  - name: Info
    description: Dashboard information and statistics

paths:
  # =========================================================================
  # Auth
  # =========================================================================
  /api/auth/login:
    put:
      tags: [Auth]
      summary: Generate JWT token
      description: Authenticate with email and password to receive a JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials

  /api/auth/admin/register:
    post:
      tags: [Auth]
      summary: Register SuperAdmin
      description: |
        Register the first SuperAdmin user (no auth required when no admin exists).
        Subsequent SuperAdmin registrations require a valid SuperAdmin JWT token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterRequest'
      responses:
        '201':
          description: SuperAdmin registered
        '400':
          description: Bad request
        '403':
          description: Admin already exists or insufficient privileges

  /api/auth/admin/exists:
    get:
      tags: [Auth]
      summary: Check if SuperAdmin exists
      security: []
      responses:
        '200':
          description: Boolean indicating whether a SuperAdmin exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExistsResponse'

  # =========================================================================
  # Tenants
  # =========================================================================
  /api/tenants:
    get:
      tags: [Tenants]
      summary: List all tenants
      description: SuperAdmin only. Returns all tenants sorted by name.
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'
        '403':
          description: Forbidden (not SuperAdmin)

    post:
      tags: [Tenants]
      summary: Create a tenant
      description: |
        SuperAdmin only. Creates a tenant, provisions MongoDB databases, NATS KV bucket,
        and optionally creates the initial TenantAdmin user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Bad request (invalid name, empty slug)
        '403':
          description: Forbidden (not SuperAdmin)
        '500':
          description: Internal error (DB/KV provisioning failure)

  /api/tenants/{slug}:
    get:
      tags: [Tenants]
      summary: Get tenant by slug
      description: SuperAdmin or the tenant's own users can access.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          description: Forbidden
        '404':
          description: Tenant not found

    put:
      tags: [Tenants]
      summary: Update tenant
      description: SuperAdmin only. Update name, status, or auth policy.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '204':
          description: Updated successfully
        '400':
          description: Bad request
        '403':
          description: Forbidden (not SuperAdmin)
        '404':
          description: Tenant not found

    delete:
      tags: [Tenants]
      summary: Delete a tenant
      description: |
        SuperAdmin only. Performs full cleanup: deletes firmware files, registry containers,
        adapter devices, users, databases, and KV buckets.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '403':
          description: Forbidden (not SuperAdmin)
        '404':
          description: Tenant not found
        '500':
          description: Cleanup error

  # =========================================================================
  # Device Password
  # =========================================================================
  /api/tenants/{slug}/device-password:
    get:
      tags: [Devices]
      summary: Get shared device password
      description: TenantAdmin+ only. Returns the shared tenant device password.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Device password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePassword'
        '403':
          description: Forbidden
        '404':
          description: Auth store not found

    put:
      tags: [Devices]
      summary: Set shared device password
      description: TenantAdmin+ only. Sets the shared tenant device password used for device authentication.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDevicePasswordRequest'
      responses:
        '200':
          description: Password set
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          description: Bad request
        '403':
          description: Forbidden

  # =========================================================================
  # CA Certs
  # =========================================================================
  /api/tenants/{slug}/ca-certs:
    get:
      tags: [CA Certs]
      summary: List CA certificates
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: List of CA certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantCACert'

    post:
      tags: [CA Certs]
      summary: Add CA certificate
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCACertRequest'
      responses:
        '201':
          description: Certificate added
        '400':
          description: Bad request

  /api/tenants/{slug}/ca-certs/{certId}:
    delete:
      tags: [CA Certs]
      summary: Remove CA certificate
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: certId
          in: path
          required: true
          schema:
            type: string
          description: Certificate MongoDB ObjectID
      responses:
        '204':
          description: Certificate removed
        '400':
          description: Bad request

  # =========================================================================
  # Users
  # =========================================================================
  /api/tenants/{slug}/users:
    get:
      tags: [Users]
      summary: List users in tenant
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Tenant not found

    post:
      tags: [Users]
      summary: Register a user in the tenant
      description: TenantAdmin can only create Operators. SuperAdmin can create TenantAdmins.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
