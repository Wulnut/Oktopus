# Local build override for docker-compose.yaml
# Adds build contexts so services are built from source instead of using registry images.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d

services:
  controller:
    build:
      context: ../../backend/services/controller
      dockerfile: build/Dockerfile

  frontend:
    build:
      context: ../../frontend
      dockerfile: build/Dockerfile
      args:
        OKTOPUS_VERSION: ${OKTOPUS_VERSION:-}
        OKTOPUS_GIT_COMMIT: ${OKTOPUS_GIT_COMMIT:-}

  stomp:
    build:
      context: ../../backend/services/mtp/stomp
      dockerfile: build/Dockerfile

  stomp-adapter:
    build:
      context: ../../backend/services/mtp/stomp-adapter
      dockerfile: build/Dockerfile

  mqtt:
    build:
      context: ../../backend/services/mtp/mqtt
      dockerfile: build/Dockerfile

  mqtt-adapter:
    build:
      context: ../../backend/services/mtp/mqtt-adapter
      dockerfile: build/Dockerfile

  ws:
    build:
      context: ../../backend/services/mtp/ws
      dockerfile: build/Dockerfile

  ws-adapter:
    build:
      context: ../../backend/services/mtp/ws-adapter
      dockerfile: build/Dockerfile

  adapter:
    build:
      context: ../../backend/services/mtp/adapter
      dockerfile: build/Dockerfile
