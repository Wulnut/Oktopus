# Development override for docker-compose.yaml
# Usage: docker-compose -f docker-compose.yaml -f docker-compose.dev.yaml up
# Or: docker-compose --env-file .env.dev up (if using profiles)

version: '3.8'

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: build/Dockerfile.dev
    image: oktopusp/frontend:dev
    volumes:
      # Mount source for hot-reload (dev mode)
      - ../../frontend/src:/app/src
      - ../../frontend/public:/app/public
      - ../../frontend/next.config.js:/app/next.config.js
      - ../../frontend/jsconfig.json:/app/jsconfig.json
      - ../../frontend/package.json:/app/package.json
      - ../../frontend/package-lock.json:/app/package-lock.json
      # Use container's node_modules and .next
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # Override .env file - use empty string for relative URLs (works with nginx proxy)
      - NEXT_PUBLIC_REST_ENDPOINT=

