# Host shells often export HTTP_PROXY for external access. Compose passes those into
# containers; in-stack HTTP (e.g. controller -> firmware-upload) must not use them.
x-clear-docker-proxy: &clear-docker-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  ALL_PROXY: ""
  all_proxy: ""

services:
  #/* ----------------------------- Message Broker ----------------------------- */
  msg_broker:
    image: "nats:2.10"
    container_name: nats
    ports:
      - 127.0.0.1:4222:4222
      - 127.0.0.1:8222:8222
    command: -c /tmp/nats/config/nats.cfg
    env_file:
      - .env.nats
    volumes:
      - ./nats_data:/tmp/nats/jetstream
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.2
    profiles: [nats]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  #/* -------------------------------------------------------------------------- */

  #/* ------------------------ API REST / USP Controller ----------------------- */
  controller:
    image: "oktopusp/controller"
    container_name: controller
    expose:
      - "8000"
    depends_on:
      - mongo_usp
    env_file:
      - .env.controller
    environment:
      <<: *clear-docker-proxy
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.3
    profiles: [controller]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/api/auth/admin/exists || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  #/* -------------------------------------------------------------------------- */

  #/* ---------------------------- Databases / Cache --------------------------- */
  mongo_usp:
    image: mongo:8
    container_name: mongo_usp
    networks:
      usp_network:
        ipv4_address: 172.16.235.4
    volumes:
      - ./mongo_data:/data/db
    profiles: [controller, adapter]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  #/* -------------------------------------------------------------------------- */

  #/* ----------------------- Message Transfer Protocols ----------------------- */
  mqtt:
    image: "oktopusp/mqtt"
    container_name: mqtt
    ports:
      - 1883:1883
      - 8883:8883
    env_file:
      - .env.mqtt
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.6
    profiles: [mqtt]
    restart: unless-stopped

  ws:
    image: "oktopusp/ws"
    container_name: websockets
    ports:
      - 8080:8080
    env_file:
      - .env.ws
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.7
    profiles: [ws]
    restart: unless-stopped

  stomp:
    image: "oktopusp/stomp"
    container_name: stomp
    ports:
      - 61613:61613
    env_file:
      - .env.stomp
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.8
    profiles: [stomp]
    restart: unless-stopped
  #/* -------------------------------------------------------------------------- */

  #/* --------------- Message transfer Protocols Adapters to NATS -------------- */
  mqtt-adapter:
    image: "oktopusp/mqtt-adapter"
    container_name: mqtt-adapter
    depends_on:
      - mqtt
    env_file:
      - .env.mqtt-adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.9
    profiles: [mqtt]
    restart: unless-stopped

  ws-adapter:
    image: "oktopusp/ws-adapter"
    container_name: ws-adapter
    depends_on:
      - ws
    env_file:
      - .env.ws-adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.10
    profiles: [ws]
    restart: unless-stopped

  stomp-adapter:
    image: "oktopusp/stomp-adapter"
    container_name: stomp-adapter
    depends_on:
      - stomp
    env_file:
      - .env.stomp-adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.11
    profiles: [stomp]
    restart: unless-stopped

  adapter:
    image: "oktopusp/adapter"
    container_name: adapter
    depends_on:
      - mongo_usp
    env_file:
      - .env.adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.12
    profiles: [adapter]
    restart: unless-stopped
  #/* -------------------------------------------------------------------------- */

  #/* ------------- SocketIO Real Time Communication With Frontend ------------- */
  socketio:
    image: "oktopusp/socketio"
    container_name: socketio
    expose:
      - "5000"
    env_file:
      - .env.socketio
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.13
    profiles: [frontend]
    restart: unless-stopped
  #/* -------------------------------------------------------------------------- */

  #/* -------------------------------- Frontend -------------------------------- */
  frontend:
    image: "oktopusp/frontend"
    container_name: frontend
    ports:
      - 127.0.0.1:3001:3000
    environment:
      - NODE_ENV=production
    networks:
      usp_network:
        ipv4_address: 172.16.235.14
    profiles: [frontend]
    restart: unless-stopped
  #/* -------------------------------------------------------------------------- */

  portainer:
    image: portainer/portainer-ce:2.25.1
    container_name: portainer
    ports:
      - 127.0.0.1:9443:9443
    networks:
      usp_network:
        ipv4_address: 172.16.235.15
    profiles: [portainer]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data

  acs:
    image: "oktopusp/acs"
    container_name: acs
    ports:
      - 0.0.0.0:9292:9292
    env_file:
      - .env.acs
    environment:
      <<: *clear-docker-proxy
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.16
    profiles: [cwmp]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - 80:80
    # Mount complete nginx.conf (includes http context + server config)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      usp_network:
        ipv4_address: 172.16.235.17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/api/auth/admin/exists || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Validate config on startup
    command: >
      sh -c "nginx -t && nginx -g 'daemon off;'"

  file-server:
    image: oktopusp/file-server
    container_name: file-server
    expose:
      - "8004"
    volumes:
      - ./firmwares:/app/firmwares
      - ./images:/app/images
    env_file:
      - .env.file-server
    networks:
      usp_network:
        ipv4_address: 172.16.235.18
    restart: unless-stopped

  firmware-upload:
    image: "oktopusp/firmware-upload"
    build:
      context: ../../backend/services/utils/firmware-upload
      dockerfile: build/Dockerfile
    container_name: firmware-upload
    expose:
      - "8006"
    volumes:
      - ./firmwares:/app/firmwares
    env_file:
      - .env.firmware-upload
    environment:
      <<: *clear-docker-proxy
    networks:
      usp_network:
        ipv4_address: 172.16.235.21
    restart: unless-stopped

  container-upload:
    build:
      context: ./container-upload-service
      dockerfile: Dockerfile
    container_name: container-upload
    expose:
      - "8005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REGISTRY: 127.0.0.1:443
      UPLOAD_SERVICE_PORT: "8005"
      <<: *clear-docker-proxy
    networks:
      usp_network:
        ipv4_address: 172.16.235.19
    restart: unless-stopped

  #/* -------------------------------- Docker Registry -------------------------------- */
  registry-certs-generator:
    build:
      context: ./registry-certs-generator
      dockerfile: Dockerfile
    container_name: registry-certs-generator
    network_mode: host
    environment:
      - CERT_DIR=/certs
      - CA_PASSPHRASE=${CA_PASSPHRASE:-registry-ca-passphrase}
      - FORCE_REGENERATE=${FORCE_REGENERATE:-false}
    volumes:
      - registry-certs:/certs
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /certs/server-cert.pem && test -f /certs/server-key.pem && test -f /certs/ca.pem"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: "no"
    profiles: [registry]

  registry:
    image: registry:2
    container_name: registry
    restart: always
    ports:
      - 443:5000
    environment:
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
      - REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server-cert.pem
      - REGISTRY_HTTP_TLS_KEY=/certs/server-key.pem
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry-certs:/certs:ro
      - registry-data:/var/lib/registry
    depends_on:
      registry-certs-generator:
        condition: service_healthy
    networks:
      usp_network:
        ipv4_address: 172.16.235.20
    profiles: [registry]
  #/* -------------------------------------------------------------------------- */

volumes:
  registry-data:
  registry-certs:
  nginx_logs:

networks:
  usp_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.235.0/24
          gateway: 172.16.235.1
