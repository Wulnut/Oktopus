services:
  #/* ----------------------------- Message Broker ----------------------------- */
  msg_broker:
    image: "nats:latest"
    container_name: nats
    ports:
      - 4222:4222
      - 8222:8222
    command: -c /tmp/nats/config/nats.cfg
    env_file:
      - .env.nats
    volumes:
      - ./nats_data:/tmp/nats/jetstream
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.2
    profiles: [nats]
  #/* -------------------------------------------------------------------------- */

  #/* ------------------------ API REST / USP Controller ----------------------- */
  controller:
    image: "oktopusp/controller"
    container_name: controller
    ports:
      - 8000:8000
    depends_on:
      - mongo_usp
    env_file:
      - .env.controller
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.3
    profiles: [controller]
  #/* -------------------------------------------------------------------------- */

  #/* ---------------------------- Databases / Cache --------------------------- */
  mongo_usp:
    image: mongo
    container_name: mongo_usp
    ports:
      - 27017:27017
    networks:
      usp_network:
        ipv4_address: 172.16.235.4
    volumes:
      - ./mongo_data:/data/db
    profiles: [controller, adapter]

  #/* -------------------------------------------------------------------------- */

  #/* ----------------------- Message Transfer Protocols ----------------------- */
  mqtt:
    image: "oktopusp/mqtt"
    container_name: mqtt
    ports:
      - 1883:1883
      - 8883:8883
    env_file:
      - .env.mqtt
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.6
    profiles: [mqtt]

  ws:
    image: "oktopusp/ws"
    container_name: websockets
    ports:
      - 8080:8080
    env_file:
      - .env.ws
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.7
    profiles: [ws]

  stomp:
    image: "oktopusp/stomp"
    container_name: stomp
    ports:
      - 61613:61613
    networks:
      usp_network:
        ipv4_address: 172.16.235.8
    profiles: [stomp]
  #/* -------------------------------------------------------------------------- */

  #/* --------------- Message transfer Protocols Adapters to NATS -------------- */
  mqtt-adapter:
    image: "oktopusp/mqtt-adapter"
    container_name: mqtt-adapter
    depends_on:
      - mqtt
    env_file:
      - .env.mqtt-adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.9
    profiles: [mqtt]

  ws-adapter:
    image: "oktopusp/ws-adapter"
    container_name: ws-adapter
    depends_on:
      - ws
    env_file:
      - .env.ws-adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.10
    profiles: [ws]

  stomp-adapter:
    image: "oktopusp/stomp-adapter"
    container_name: stomp-adapter
    depends_on:
      - stomp
    env_file:
      - .env.stomp-adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.11
    profiles: [stomp]

  adapter:
    image: "oktopusp/adapter"
    container_name: adapter
    depends_on:
      - mongo_usp
    env_file:
      - .env.adapter
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.12
    profiles: [adapter]
  #/* -------------------------------------------------------------------------- */

  #/* ------------- SocketIO Real Time Communication With Frontend ------------- */
  socketio:
    image: "oktopusp/socketio"
    container_name: socketio
    ports:
      - 5000:5000
    env_file:
      - .env.socketio
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.13
    profiles: [frontend]
  #/* -------------------------------------------------------------------------- */

  #/* -------------------------------- Frontend -------------------------------- */
  frontend:
    build:
      context: ../../frontend
      dockerfile: build/Dockerfile
    # Don't specify image name to force local build instead of pulling from registry
    container_name: frontend
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
    networks:
      usp_network:
        ipv4_address: 172.16.235.14
    profiles: [frontend]
  #/* -------------------------------------------------------------------------- */

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - 9443:9443
    networks:
      usp_network:
        ipv4_address: 172.16.235.15
    profiles: [portainer]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data

  acs:
    image: "oktopusp/acs"
    container_name: acs
    ports:
      - 9292:9292
    env_file:
      - .env.acs
    volumes:
      - ./nats_config:/tmp/nats/config
    networks:
      usp_network:
        ipv4_address: 172.16.235.16
    profiles: [cwmp]

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      usp_network:
        ipv4_address: 172.16.235.17

  file-server:
    image: oktopusp/file-server
    container_name: file-server
    ports:
      - 8004:8004
    volumes:
      - ./firmwares:/app/firmwares
      - ./images:/app/images
    env_file:
      - .env.file-server
    networks:
      usp_network:
        ipv4_address: 172.16.235.18

  container-upload:
    build:
      context: ./container-upload-service
      dockerfile: Dockerfile
    container_name: container-upload
    ports:
      - 8005:8005
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REGISTRY=127.0.0.1:443
      - UPLOAD_SERVICE_PORT=8005
    networks:
      usp_network:
        ipv4_address: 172.16.235.19

  #/* -------------------------------- Docker Registry -------------------------------- */
  registry-certs-generator:
    build:
      context: ./registry-certs-generator
      dockerfile: Dockerfile
    container_name: registry-certs-generator
    network_mode: host
    environment:
      - CERT_DIR=/certs
      - CA_PASSPHRASE=${CA_PASSPHRASE:-registry-ca-passphrase}
      - FORCE_REGENERATE=${FORCE_REGENERATE:-false}
    volumes:
      - registry-certs:/certs
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /certs/server-cert.pem && test -f /certs/server-key.pem && test -f /certs/ca.pem"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: "no"
    profiles: [registry]

  registry:
    image: registry:2
    container_name: registry
    restart: always
    ports:
      - 443:5000
    environment:
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
      - REGISTRY_HTTP_TLS_CERTIFICATE=/certs/server-cert.pem
      - REGISTRY_HTTP_TLS_KEY=/certs/server-key.pem
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry-certs:/certs:ro
      - registry-data:/var/lib/registry
    depends_on:
      registry-certs-generator:
        condition: service_healthy
    networks:
      usp_network:
        ipv4_address: 172.16.235.20
    profiles: [registry]
  #/* -------------------------------------------------------------------------- */

volumes:
  registry-data:
  registry-certs:

networks:
  usp_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.235.0/24
          gateway: 172.16.235.1
