name: oktopus-test

services:
  mongo_test:
    image: mongo:7.0
    tmpfs:
      - /data/db
    networks:
      - test_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 10
    profiles: [integration, snapshot]

  nats_test:
    image: nats:2.10
    command: ["--js"]
    networks:
      - test_network
    profiles: [integration, snapshot]

  test-controller-unit:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/controller:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    command: go test -v -count=1 ./internal/cwmp/ ./internal/usp/usp_utils/ ./internal/api/ ./internal/config/
    networks:
      - test_network
    profiles: [unit]

  test-bridge:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/controller:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - NATS_TEST_URL=nats://nats_test:4222
    command: sh -c "sleep 3 && go test -v -count=1 -timeout=120s ./internal/bridge/"
    depends_on:
      - nats_test
    networks:
      - test_network
    profiles: [integration]

  test-db:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/controller:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - MONGO_TEST_URI=mongodb://mongo_test:27017
    command: sh -c "sleep 3 && go test -v -count=1 -tags=integration -timeout=60s ./internal/db/"
    depends_on:
      - mongo_test
    networks:
      - test_network
    profiles: [integration]

  test-adapter:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/mtp/adapter:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    command: go test -v -count=1 ./internal/events/usp_handler/
    networks:
      - test_network
    profiles: [unit]

  test-mqtt:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/mtp/mqtt:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    command: go test -v -count=1 ./internal/listeners/mqtt/
    networks:
      - test_network
    profiles: [unit]

  test-acs:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/acs:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
    command: go test -race -v -count=1 ./internal/server/handler/
    networks:
      - test_network
    profiles: [unit]

  test-handlers:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../backend/services/controller:/app
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - MONGO_TEST_URI=mongodb://mongo_test:27017
      - NATS_TEST_URL=nats://nats_test:4222
    command: sh -c "sleep 3 && go test -v -count=1 -tags=integration -timeout=120s ./internal/api/"
    depends_on:
      - mongo_test
      - nats_test
    networks:
      - test_network
    profiles: [integration]

  test-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../../frontend:/app
    command: sh -c "npm ci && npm test -- --verbose"
    networks:
      - test_network
    profiles: [unit]

  test-infra:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ../../deploy/tests:/app
      - ../../:/project:ro
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - PROJECT_ROOT=/project
    command: go test -v -count=1 ./...
    networks:
      - test_network
    profiles: [unit]

  test-fixtures:
    image: python:3.12-alpine
    working_dir: /workspace/scripts/test-data
    volumes:
      - ../../:/workspace:ro
    command: python -m unittest -v test_sanitize.py
    networks:
      - test_network
    profiles: [unit]

  # New black-box HTTP snapshot suite — independent Go module under
  # backend/services/controller/tests/api_snapshot/. Mounts the repo root at
  # /workspace so the module's replace directive + fixtures/ resolve.
  # See docs/plans/2026-07-11-test-plan-v3.md.
  test-controller-snapshot:
    image: golang:1.23
    working_dir: /workspace/backend/services/controller/tests/api_snapshot
    volumes:
      - ../../:/workspace
    environment:
      - GOPROXY=${GOPROXY:-https://goproxy.cn,direct}
      - GOFLAGS=-mod=mod
      - MONGO_TEST_URI=mongodb://mongo_test:27017
      - NATS_TEST_URL=nats://nats_test:4222
      - SECRET_API_KEY=test-secret-key-for-snapshot
      # Set RUN_LOAD=1 to enable ./load/... tests (off by default).
      - RUN_LOAD=${RUN_LOAD:-}
    command: sh -c "sleep 3 && go test -v -count=1 -timeout=300s ./..."
    depends_on:
      - mongo_test
      - nats_test
    networks:
      - test_network
    profiles: [snapshot]

networks:
  test_network:
    driver: bridge
