# Production overlay for GCP production VM (8GB RAM).
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --profile <profiles> up -d
#
# Tuning (8GB host — leaves headroom for build + other containers):
#   - MongoDB WiredTiger cache 1.0GB (default would use ~50% of RAM)
#   - Frontend Node.js heap 512MB
#   - NATS JetStream in-memory cap 256MB (remainder on disk)

services:
  mongo_usp:
    command: ["--wiredTigerCacheSizeGB", "1"]

  frontend:
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512

  msg_broker:
    environment:
      - JETSTREAM_MAX_MEMORY=268435456
