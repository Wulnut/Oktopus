# Complete nginx configuration with rate limiting
# This file includes both http context (for rate limiting zones) and server configuration
# Simplified single-file solution

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enhanced log format including rate limit status
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'limit_req_status=$limit_req_status';

    # Rate limit violation log format
    log_format  rate_limit  '$remote_addr - [$time_local] "$request" '
                            'rate_limit_status=$limit_req_status';

    # Map to filter rate limit violations (only log when status is set)
    map $limit_req_status $log_rate_limit {
        ""        0;  # Don't log if no rate limit status
        default   1;  # Log if rate limit status is set
    }

    access_log  /var/log/nginx/access.log  main;
    # Rate limit violations log (only logs when rate limit is triggered)
    access_log  /var/log/nginx/rate_limit.log  rate_limit if=$log_rate_limit;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ============================================
    # Rate Limiting Zones (must be in http context)
    # ============================================

    # General API rate limit: 300 requests per minute per IP
    # (dashboard pages fan out several parallel GETs; 100r/m was too tight for ops UI)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;

    # History query endpoint (GET): 30 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_history_get:10m rate=30r/m;

    # File downloads: 60 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=file_download:10m rate=60r/m;


    # ============================================
    # Server Configuration
    # ============================================
    
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root         /usr/share/nginx/html;
        
        # Resolver for DNS resolution (required when using variables in proxy_pass)
        resolver 127.0.0.11 valid=30s;
        
        # Default body size limit for API endpoints
        client_max_body_size 10M;

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        # Custom error page for rate limiting (429)
        error_page 429 /429.html;
        location = /429.html {
            internal;
            default_type application/json;
            return 429 '{"error":"Rate limit exceeded","message":"Too many requests. Please try again later.","retry_after":60}';
            add_header Content-Type application/json always;
            add_header Retry-After "60" always;
        }

        # Controller liveness — no rate limit (used by compose healthchecks)
        location = /healthz {
            proxy_pass             http://controller:8000/healthz;
            proxy_read_timeout     5;
            proxy_connect_timeout  5;
            proxy_redirect         off;
        }

        # Frontend proxy
        location / {
            proxy_pass             http://frontend:3000;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $http_host;
            proxy_cache_bypass $http_upgrade;
        }

        # History endpoint - rate limiting
        # GET requests: 30 requests/minute (supports auto-refresh every 5 seconds = 12 req/min)
        # DELETE requests: Also limited to 30r/m, but protected by backend authorization
        # Note: Using 30r/m for all methods. DELETE is further protected by:
        # - Backend authorization checks
        # - Audit logging
        # - User confirmation dialog in UI
        location ~ ^/api/tenants/[^/]+/devices/[^/]+/history$ {
            # Use GET limit (30r/m) which supports auto-refresh functionality
            limit_req zone=api_history_get burst=5 nodelay;
            limit_req_status 429;
            
            proxy_pass             http://controller:8000;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;

            add_header X-RateLimit-Limit "30r/m" always;
            add_header Retry-After "60" always;
        }

        # Firmware upload via controller API - needs larger body
        location ~ ^/api/tenants/[^/]+/firmware {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;
            client_max_body_size 500M;

            proxy_pass             http://controller:8000;
            proxy_read_timeout     120;
            proxy_connect_timeout  60;
            proxy_redirect         off;
            proxy_set_header       Host $http_host;
            proxy_set_header       X-Forwarded-Proto $scheme;
        }

        # General API endpoints - standard rate limit
        # Must come after more specific /api locations
        location /api {
            limit_req zone=api_general burst=60 nodelay;
            limit_req_status 429;

            proxy_pass             http://controller:8000;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;
            proxy_set_header       Host $http_host;
            proxy_set_header       X-Forwarded-Proto $scheme;

            # Add rate limit headers
            add_header X-RateLimit-Limit "300r/m" always;
            add_header Retry-After "60" always;
        }

        # Container upload service (no rate limiting - large file uploads)
        location /api/containers/upload {
            proxy_pass             http://container-upload:8005/upload;
            proxy_read_timeout     600;
            proxy_connect_timeout  60;
            proxy_redirect         off;
            client_max_body_size   10G;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /api/containers/delete {
            proxy_pass             http://container-upload:8005/delete;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;
        }

        location /images {
            limit_req zone=file_download burst=10 nodelay;
            limit_req_status 429;
            proxy_pass             http://file-server:8004;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;
        }

        location /firmwares {
            limit_req zone=file_download burst=10 nodelay;
            limit_req_status 429;
            proxy_pass             http://file-server:8004;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;
        }

        # Docker Registry proxy — requires authentication to prevent
        # unauthenticated browsing of the container catalog.
        # SECURITY: This prevents tenants from listing other tenants' containers
        # via the /_catalog endpoint. Download-level isolation is NOT enforced
        # at the registry level — see docs/SECURITY.md.
        location /docker-registry/ {
            # Require auth header
            if ($http_authorization = '') {
                return 401 '{"error":"Authentication required"}';
            }

            rewrite ^/docker-registry/(.*)$ /$1 break;
            proxy_pass             https://172.17.0.1:443;
            proxy_read_timeout     60;
            proxy_connect_timeout  60;
            proxy_redirect         off;
            proxy_ssl_verify       off;
            proxy_ssl_verify_depth 0;
            proxy_ssl_server_name  off;
            proxy_ssl_name         127.0.0.1;
            proxy_set_header        Host 127.0.0.1:443;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }
}
