server {
    listen 80;
    listen [::]:80;
    server_name _;
    root         /usr/share/nginx/html;

    include /etc/nginx/default.d/*.conf;

    error_page 404 /404.html;
    location = /404.html {
    }

    location / {
        proxy_pass             http://host.docker.internal:3000;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    location /api {
        proxy_pass             http://host.docker.internal:8000;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
    }
    location /images {
        proxy_pass             http://host.docker.internal:8004;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
    }
    # Docker Registry proxy - handles SSL certificate errors
    # Registry IP/host is passed via query parameter: ?registry=192.168.1.24
    # Usage: /docker-registry/v2/_catalog?registry=192.168.1.24
    # Example: /docker-registry/v2/my_cortexa53_container/tags/list?registry=192.168.1.24
    location /docker-registry/ {
        # Extract registry from query parameter
        set $registry_host $arg_registry;
        if ($registry_host = "") {
            return 400 "Missing registry parameter";
        }
        # Rewrite to proxy to the registry
        rewrite ^/docker-registry/(.*)$ /$1 break;
        # Always use HTTPS for Docker registry (nginx proxies to https://)
        proxy_pass             https://$registry_host;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
        proxy_ssl_verify       off;  # Ignore SSL certificate errors
        proxy_set_header        Host $registry_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
    location /companylink {
        return 301 https://oktopus.app.br/controller;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}