# Map registry host to proxy host (convert 127.0.0.1 to host.docker.internal)
# This allows containers to access the host's Docker registry
# Patterns are evaluated in order, so most specific first
# Using IP directly (172.17.0.1) as fallback since DNS resolution can be unreliable
map $arg_registry $registry_proxy_host {
    default $arg_registry;
    "~^127\.0\.0\.1:443$" 172.17.0.1:443;
    "~^127\.0\.0\.1:5000$" 172.17.0.1:5000;
    "~^127\.0\.0\.1$" 172.17.0.1:443;
    "~^127\.0\.0\.1:" 172.17.0.1:443;  # Any other port with 127.0.0.1
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root         /usr/share/nginx/html;
    
    # Resolver for DNS resolution (required when using variables in proxy_pass)
    # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;
    
    # Increase max body size globally (can be overridden per location)
    client_max_body_size 10G;

    include /etc/nginx/default.d/*.conf;

    error_page 404 /404.html;
    location = /404.html {
    }

    location / {
        proxy_pass             http://host.docker.internal:3000;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    location /api {
        proxy_pass             http://host.docker.internal:8000;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
    }
    # Container upload service
    location /api/containers/upload {
        proxy_pass             http://host.docker.internal:8005/upload;
        proxy_read_timeout     600;
        proxy_connect_timeout  60;
        proxy_redirect         off;
        client_max_body_size   10G;
        # Increase buffer sizes for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location /api/containers/delete {
        proxy_pass             http://host.docker.internal:8005/delete;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
    }
    location /images {
        proxy_pass             http://host.docker.internal:8004;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
    }
    # Docker Registry proxy - handles SSL certificate errors
    # Registry IP/host is passed via query parameter: ?registry=192.168.1.24
    # Usage: /docker-registry/v2/_catalog?registry=192.168.1.24
    # Usage: /docker-registry/v2/_catalog?registry=127.0.0.1:443 (converted to host.docker.internal:443)
    # Example: /docker-registry/v2/my_cortexa53_container/tags/list?registry=192.168.1.24
    location /docker-registry/ {
        # Extract registry from query parameter
        set $registry_host $arg_registry;
        if ($registry_host = "") {
            return 400 "Missing registry parameter";
        }
        # Rewrite to proxy to the registry
        rewrite ^/docker-registry/(.*)$ /$1 break;
        # Always use HTTPS for Docker registry (nginx proxies to https://)
        # $registry_proxy_host is set by map directive (converts 127.0.0.1 to host.docker.internal)
        # Note: resolver is required when using variables in proxy_pass
        proxy_pass             https://$registry_proxy_host;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
        # Ignore SSL certificate errors completely
        proxy_ssl_verify       off;
        proxy_ssl_verify_depth 0;
        proxy_ssl_server_name  off;
        proxy_ssl_name         $registry_host;
        proxy_set_header        Host $registry_host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }
    location /companylink {
        return 301 https://oktopus.app.br/controller;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}