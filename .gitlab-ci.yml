# Oktopus CI — 8 test jobs; unit tests parallel, integration after unit (parallel).
# Deploy: source pack + SSH + remote build (auto on telkomsel/ont-lock-dev and telkomsel/ont-lock).
# Local tests: deploy/compose/docker-compose.test.yaml
# Runner tag: oktopus-docker

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^telkomsel\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - oktopus-docker

variables:
  GOPROXY: "https://goproxy.cn,direct"
  MONGO_TEST_URI: "mongodb://mongo_test:27017"
  NATS_TEST_URL: "nats://nats_test:4222"
  CI_GOLANG_IMAGE: "golang:1.23"
  CI_NODE_IMAGE: "node:22-alpine"

stages:
  - test-unit
  - test-integration
  - deploy

.test_artifacts:
  artifacts:
    when: always
    paths:
      - test-reports/
    expire_in: 1 week

.go_job:
  image: $CI_GOLANG_IMAGE
  before_script:
    - mkdir -p test-reports
    - go install github.com/jstemmer/go-junit-report/v2@latest
    - |
      go_test_report() {
        set -o pipefail
        local log="$CI_PROJECT_DIR/$1"
        local junit="$CI_PROJECT_DIR/$2"
        shift 2
        "$@" 2>&1 | tee "$log" | go-junit-report -set-exit-code > "$junit"
      }
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: $JUNIT_REPORT
    expire_in: 1 week

.node_job:
  image: $CI_NODE_IMAGE
  before_script:
    - mkdir -p test-reports
  extends: .test_artifacts

# ---------------------------------------------------------------------------
# Unit tests — 5 jobs in parallel (stage: test-unit)
# ---------------------------------------------------------------------------
test:unit:controller:
  extends: .go_job
  stage: test-unit
  variables:
    JUNIT_REPORT: test-reports/test-controller-unit-junit.xml
  script:
    - go_test_report test-reports/test-controller-unit.log "$JUNIT_REPORT" bash -c 'cd backend/services/controller && go test -v -count=1 ./internal/cwmp/ ./internal/usp/usp_utils/ ./internal/api/'

test:unit:acs:
  extends: .go_job
  stage: test-unit
  variables:
    JUNIT_REPORT: test-reports/test-acs-junit.xml
  script:
    - go_test_report test-reports/test-acs.log "$JUNIT_REPORT" bash -c 'cd backend/services/acs && go test -race -v -count=1 ./internal/server/handler/'

test:unit:adapter:
  extends: .go_job
  stage: test-unit
  variables:
    JUNIT_REPORT: test-reports/test-adapter-junit.xml
  script:
    - go_test_report test-reports/test-adapter.log "$JUNIT_REPORT" bash -c 'cd backend/services/mtp/adapter && go test -v -count=1 ./internal/events/usp_handler/'

test:unit:infra:
  extends: .go_job
  stage: test-unit
  variables:
    JUNIT_REPORT: test-reports/test-infra-junit.xml
  script:
    - go_test_report test-reports/test-infra.log "$JUNIT_REPORT" bash -c 'cd deploy/tests && PROJECT_ROOT="$CI_PROJECT_DIR" go test -v -count=1 ./...'

test:unit:frontend:
  extends: .node_job
  stage: test-unit
  script:
    - cd "$CI_PROJECT_DIR/frontend" && npm ci && JEST_JUNIT_OUTPUT_FILE="$CI_PROJECT_DIR/test-reports/frontend-junit.xml" npm test -- --verbose --ci --reporters=default --reporters=jest-junit | tee "$CI_PROJECT_DIR/test-reports/test-frontend.log"
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/frontend-junit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Integration tests — 3 jobs in parallel after all unit tests pass
# ---------------------------------------------------------------------------
.test_integration_needs:
  needs:
    - test:unit:controller
    - test:unit:acs
    - test:unit:adapter
    - test:unit:infra
    - test:unit:frontend

test:integration:db:
  extends:
    - .go_job
    - .test_integration_needs
  stage: test-integration
  variables:
    JUNIT_REPORT: test-reports/test-db-junit.xml
  services:
    - name: mongo:7.0
      alias: mongo_test
  script:
    - sleep 3
    - go_test_report test-reports/test-db.log "$JUNIT_REPORT" bash -c 'cd backend/services/controller && go test -v -count=1 -tags=integration -timeout=60s ./internal/db/'

test:integration:bridge:
  extends:
    - .go_job
    - .test_integration_needs
  stage: test-integration
  variables:
    JUNIT_REPORT: test-reports/test-bridge-junit.xml
  services:
    - name: nats:2.10
      alias: nats_test
      command: ["--js"]
  script:
    - sleep 3
    - go_test_report test-reports/test-bridge.log "$JUNIT_REPORT" bash -c "cd backend/services/controller && go test -v -count=1 -timeout=120s -run 'TestNatsUspInteraction_SingleRequest_Success|TestNatsUspInteraction_Timeout' ./internal/bridge/"

test:integration:handlers:
  extends:
    - .go_job
    - .test_integration_needs
  stage: test-integration
  variables:
    JUNIT_REPORT: test-reports/test-handlers-junit.xml
  services:
    - name: mongo:7.0
      alias: mongo_test
    - name: nats:2.10
      alias: nats_test
      command: ["--js"]
  script:
   - sleep 5
   - go_test_report test-reports/test-handlers.log "$JUNIT_REPORT" bash -c 'cd backend/services/controller && go test -v -count=1 -tags=integration -timeout=120s ./internal/api/'

# ---------------------------------------------------------------------------
# Deploy — upload source, build on target server, restart compose stack
# telkomsel/ont-lock-dev -> staging (192.168.0.106)
# telkomsel/ont-lock     -> production GCP (auto after integration tests)
# ---------------------------------------------------------------------------
.test_integration_deploy_needs:
  needs:
    - test:integration:db
    - test:integration:bridge
    - test:integration:handlers

.deploy_ssh:
  stage: deploy
  image: debian:bookworm-slim
  timeout: 2h
  extends: .test_integration_deploy_needs
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client tar rsync > /dev/null
    - export SSH_PORT="${SSH_PORT:-22}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if echo "$SSH_KEY" | grep -qE 'BEGIN.*PRIVATE KEY'; then
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
      else
        echo "$SSH_KEY" | base64 -d > ~/.ssh/id_deploy
      fi
    - chmod 400 ~/.ssh/id_deploy
  script:
    - chmod +x deploy/compose/ci-pack-source.sh deploy/compose/ci-source-deploy.sh
    # Stamp version.json into the tarball (shell; deploy image has no node).
    - OKTOPUS_GIT_COMMIT="${CI_COMMIT_SHORT_SHA}" ./deploy/compose/ci-pack-source.sh
    - scp -P "${SSH_PORT}" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new /tmp/oktopus-src.tgz "${REMOTE}:/tmp/oktopus-src.tgz"
    - |
      ssh -p "${SSH_PORT}" -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "${REMOTE}" \
        "set -euo pipefail
         mkdir -p '${DEPLOY_REPO_ROOT}'
         tar xzf /tmp/oktopus-src.tgz -C '${DEPLOY_REPO_ROOT}'
         chmod +x '${DEPLOY_COMPOSE_DIR}/ci-source-deploy.sh'
         cd '${DEPLOY_COMPOSE_DIR}' \
           && OKTOPUS_GIT_COMMIT='${CI_COMMIT_SHORT_SHA}' \
              CI_COMMIT_SHORT_SHA='${CI_COMMIT_SHORT_SHA}' \
              ./ci-source-deploy.sh '${OKTOPUS_DEPLOY_ENV}'
         rm -f /tmp/oktopus-src.tgz"

deploy:staging:
  extends: .deploy_ssh
  resource_group: deploy-staging
  # GitLab CI/CD variables (staging / telkomsel/ont-lock-dev only):
  #   DEPLOY_DEV_SSH_KEY, DEPLOY_DEV_HOST, DEPLOY_DEV_USER, DEPLOY_DEV_SSH_PORT
  variables:
    SSH_KEY: $DEPLOY_DEV_SSH_KEY
    REMOTE: $DEPLOY_DEV_USER@$DEPLOY_DEV_HOST
    SSH_PORT: $DEPLOY_DEV_SSH_PORT
    DEPLOY_REPO_ROOT: /root/oktopus
    DEPLOY_COMPOSE_DIR: /root/oktopus/deploy/compose
    OKTOPUS_DEPLOY_ENV: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "telkomsel/ont-lock-dev"

deploy:production:
  extends: .deploy_ssh
  resource_group: deploy-production
  environment:
    name: production
    url: http://$GCP_HOST
  # GitLab CI/CD variables (production / telkomsel/ont-lock only):
  #   SSH_PRIVATE_KEY — GCP SSH private key (PEM or base64)
  #   GCP_HOST        — GCP server IP
  #   GCP_USER        — SSH username
  #   SSH_PORT        — SSH port (default 22 in .deploy_ssh before_script)
  variables:
    SSH_KEY: $SSH_PRIVATE_KEY
    REMOTE: $GCP_USER@$GCP_HOST
    SSH_PORT: $SSH_PORT
    DEPLOY_REPO_ROOT: /home/sei/oktopus
    DEPLOY_COMPOSE_DIR: /home/sei/oktopus/deploy/compose
    OKTOPUS_DEPLOY_ENV: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "telkomsel/ont-lock"
