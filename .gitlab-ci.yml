# Oktopus CI — runs existing Docker-based test suite via host docker.sock (no DinD).
# Runner: oktopus-docker (oktopus-docker-runner, see /home/liangyz/gitlab-docker/config/config.toml)
#
# Tests run serially within each job to avoid overloading a single host Docker daemon.
# Runner config must mount: /var/run/docker.sock:/var/run/docker.sock

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^telkomsel\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - oktopus-docker
  image: docker:24-cli

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  COMPOSE_DIR: "deploy/compose"
  COMPOSE_FILE: "docker-compose.test.yaml"
  # Override in GitLab CI/CD Variables if the default proxy is unreachable.
  GOPROXY: "https://goproxy.cn,direct"

stages:
  - test-unit
  - test-integration

.docker_compose_test:
  before_script:
    - docker info
    - mkdir -p test-reports
    - cd "$COMPOSE_DIR"
  after_script:
    - cd "$COMPOSE_DIR"
    - docker compose -f "$COMPOSE_FILE" --profile unit --profile integration down -v --remove-orphans || true
  artifacts:
    when: always
    paths:
      - test-reports/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Unit tests — serial within one job
# ---------------------------------------------------------------------------
test:unit:
  extends: .docker_compose_test
  stage: test-unit
  script:
    - sh ci-test-unit.sh
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/*-junit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Integration tests — serial within one job
# ---------------------------------------------------------------------------
test:integration:
  extends: .docker_compose_test
  stage: test-integration
  script:
    - sh ci-test-integration.sh
