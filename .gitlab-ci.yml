# Oktopus CI — 8 test jobs; unit tests parallel, integration after unit (parallel).
# Local tests: deploy/compose/docker-compose.test.yaml
# Runner tag: oktopus-docker

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^telkomsel\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - oktopus-docker

variables:
  GOPROXY: "https://goproxy.cn,direct"
  MONGO_TEST_URI: "mongodb://mongo_test:27017"
  NATS_TEST_URL: "nats://nats_test:4222"
  CI_GOLANG_IMAGE: "golang:1.23"
  CI_NODE_IMAGE: "node:22-alpine"

stages:
  - test-unit
  - test-integration

.test_artifacts:
  artifacts:
    when: always
    paths:
      - test-reports/
    expire_in: 1 week

.go_job:
  image: $CI_GOLANG_IMAGE
  before_script:
    - mkdir -p test-reports
  extends: .test_artifacts

.node_job:
  image: $CI_NODE_IMAGE
  before_script:
    - mkdir -p test-reports
  extends: .test_artifacts

# ---------------------------------------------------------------------------
# Unit tests — 5 jobs in parallel (stage: test-unit)
# ---------------------------------------------------------------------------
test:unit:controller:
  extends: .go_job
  stage: test-unit
  script:
    - cd backend/services/controller && go test -v -count=1 ./internal/cwmp/ ./internal/usp/usp_utils/ ./internal/api/ | tee "$CI_PROJECT_DIR/test-reports/test-controller-unit.log"

test:unit:acs:
  extends: .go_job
  stage: test-unit
  script:
    - cd backend/services/acs && go test -race -v -count=1 ./internal/server/handler/ | tee "$CI_PROJECT_DIR/test-reports/test-acs.log"

test:unit:adapter:
  extends: .go_job
  stage: test-unit
  script:
    - cd backend/services/mtp/adapter && go test -v -count=1 ./internal/events/usp_handler/ | tee "$CI_PROJECT_DIR/test-reports/test-adapter.log"

test:unit:infra:
  extends: .go_job
  stage: test-unit
  script:
    - cd deploy/tests && PROJECT_ROOT="$CI_PROJECT_DIR" go test -v -count=1 ./... | tee "$CI_PROJECT_DIR/test-reports/test-infra.log"

test:unit:frontend:
  extends: .node_job
  stage: test-unit
  script:
    - cd "$CI_PROJECT_DIR/frontend" && npm ci && JEST_JUNIT_OUTPUT_FILE="$CI_PROJECT_DIR/test-reports/frontend-junit.xml" npm test -- --verbose --ci --reporters=default --reporters=jest-junit | tee "$CI_PROJECT_DIR/test-reports/test-frontend.log"
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/frontend-junit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Integration tests — 3 jobs in parallel after all unit tests pass
# ---------------------------------------------------------------------------
.test_integration_needs:
  needs:
    - test:unit:controller
    - test:unit:acs
    - test:unit:adapter
    - test:unit:infra
    - test:unit:frontend

test:integration:db:
  extends:
    - .go_job
    - .test_integration_needs
  stage: test-integration
  services:
    - name: mongo:7.0
      alias: mongo_test
  script:
    - sleep 3
    - cd backend/services/controller && go test -v -count=1 -tags=integration -timeout=60s ./internal/db/ | tee "$CI_PROJECT_DIR/test-reports/test-db.log"

test:integration:bridge:
  extends:
    - .go_job
    - .test_integration_needs
  stage: test-integration
  services:
    - name: nats:2.10
      alias: nats_test
      command: ["--js"]
  script:
    - sleep 3
    - cd backend/services/controller && go test -v -count=1 -timeout=120s -run 'SingleRequest_Success|Timeout' ./internal/bridge/ | tee "$CI_PROJECT_DIR/test-reports/test-bridge.log"

test:integration:handlers:
  extends:
    - .go_job
    - .test_integration_needs
  stage: test-integration
  services:
    - name: mongo:7.0
      alias: mongo_test
    - name: nats:2.10
      alias: nats_test
      command: ["--js"]
  script:
    - sleep 5
    - cd backend/services/controller && go test -v -count=1 -tags=integration -timeout=120s ./internal/api/ | tee "$CI_PROJECT_DIR/test-reports/test-handlers.log"
