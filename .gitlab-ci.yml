# Oktopus CI — tests run in job containers (checkout mounted by GitLab Runner).
# Local tests still use: deploy/compose/docker-compose.test.yaml
# Runner tag: oktopus-docker

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/i
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^telkomsel\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  tags:
    - oktopus-docker

variables:
  GOPROXY: "https://goproxy.cn,direct"
  MONGO_TEST_URI: "mongodb://mongo_test:27017"
  NATS_TEST_URL: "nats://nats_test:4222"

stages:
  - test-unit
  - test-integration

.test_artifacts:
  artifacts:
    when: always
    paths:
      - test-reports/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Unit tests — backend then frontend (serial stages)
# ---------------------------------------------------------------------------
test:unit:backend:
  extends: .test_artifacts
  stage: test-unit
  image: golang:1.23
  before_script:
    - mkdir -p test-reports
  script:
    - sh deploy/compose/ci-test-unit.sh

test:unit:frontend:
  extends: .test_artifacts
  stage: test-unit
  image: node:22-alpine
  needs:
    - test:unit:backend
  before_script:
    - mkdir -p test-reports
  script:
    - sh deploy/compose/ci-test-frontend.sh
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/frontend-junit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Integration tests — GitLab service containers for MongoDB + NATS
# ---------------------------------------------------------------------------
test:integration:
  extends: .test_artifacts
  stage: test-integration
  image: golang:1.23
  services:
    - name: mongo:7.0
      alias: mongo_test
    - name: nats:2.10
      alias: nats_test
      command: ["--js"]
  before_script:
    - mkdir -p test-reports
  script:
    - sh deploy/compose/ci-test-integration.sh
